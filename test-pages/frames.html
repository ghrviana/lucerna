<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Teste de frames (frameset)</title>
  </head>
  <frameset cols="25%,75%">
    <frame src="frames/menu.html" name="menu" title="Menu" />
    <frame src="frames/conteudo.html" name="conteudo" title="Conteúdo" />
    <noframes>

        Seu navegador não suporta frames.
      </body>
    </noframes>
  </frameset>
</html>
