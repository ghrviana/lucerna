<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Login falso (agente)</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 420px;
        margin: 2rem auto;
      }
      label {
        display: block;
        margin: 0.6rem 0;
      }
    </style>
  </head>
  <body>
    <h1>Banco Fictício: entrar</h1>
    <p>Página de teste. O agente pode digitar o usuário, mas nunca a senha nem o código 2FA.</p>
    <form method="post" action="/agent/result">
      <label>Usuário <input name="usuario" autocomplete="username" /></label>
      <label>Senha <input name="senha" type="password" autocomplete="current-password" /></label>
      <label
        >Código de verificação (2FA)
        <input name="codigo" inputmode="numeric" autocomplete="one-time-code"
      /></label>
      <button>Entrar</button>
    </form>
  </body>
</html>
